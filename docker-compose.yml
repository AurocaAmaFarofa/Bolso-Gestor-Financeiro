services:
  bolso-db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: bolso-db

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - bolso-db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-P',
          '3306',
          '-u',
          '${DB_USER}',
          '-p${DB_PASSWORD}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - bolso-network

  bolso-app:
    build: .
    container_name: bolso-app-container

    ports:
      - '3000:3000'

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SESSION_SECRET: ${SESSION_SECRET}

    depends_on:
      bolso-db:
        condition: service_healthy

    networks:
      - bolso-network

volumes:
  bolso-db-data:

networks:
  bolso-network:
