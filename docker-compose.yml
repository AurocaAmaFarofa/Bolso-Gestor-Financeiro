services:
  bolso-db:
    image: mysql:8.4
    container_name: bolso-db

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}

    volumes:
      - bolso-db-data:/var/lib/mysql
      - ./estrutura_bolso.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro

    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-pBolsoDev123!',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - bolso-network

  bolso-app:
    build: .
    container_name: bolso-app-container

    ports:
      - '3000:3000'

    environment:
      DB_HOST:
      DB_USER:
      DB_PASSWORD:
      DB_NAME:
      SESSION_SECRET:

    depends_on:
      bolso-db:
        condition: service_healthy

    networks:
      - bolso-network

volumes:
  bolso-db-data:

networks:
  bolso-network:
