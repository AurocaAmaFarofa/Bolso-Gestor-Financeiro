<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolso — Criar conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div class="login-wrapper">
      <div class="brand">
        <div class="brand-mark">R$</div>
        <div class="brand-title">Bolso</div>
      </div>

      <div class="login-card">
        <div class="login-heading">
          <h1>Criar sua conta</h1>
          <p>Leva menos de um minuto para começar a organizar seu dinheiro.</p>
        </div>

        <form class="login-form" id="signup-form" novalidate>
          <div class="field">
            <label for="nome">Nome completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Como podemos te chamar"
              required
              autocomplete="name"
            />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="voce@email.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <div class="field-password-wrap">
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
                required
                autocomplete="new-password"
                minlength="12"
                maxlength="64"
              />
              <button type="button" class="toggle-visibility" id="toggle-senha">
                mostrar
              </button>
            </div>
            <div class="strength-meter">
              <div class="strength-bar" id="bar-1"></div>
              <div class="strength-bar" id="bar-2"></div>
              <div class="strength-bar" id="bar-3"></div>
            </div>
            <div class="strength-label" id="strength-label">
              Mínimo de 12 caracteres
            </div>
          </div>

          <div class="field">
            <label for="confirmar-senha">Confirmar senha</label>
            <div class="field-password-wrap">
              <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Repita a senha"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="toggle-visibility"
                id="toggle-confirmar"
              >
                mostrar
              </button>
            </div>

            <div class="strength-label" id="confirmacao-label"></div>
          </div>

          <!--<label class="terms-row">
            <input type="checkbox" id="termos" required />
            Li e aceito os <a href="#" id="link-termos">Termos de uso</a> e a
            <a href="#" id="link-privacidade">Política de privacidade</a>
          </label>-->

          <div class="error-msg" id="error-msg">
            Confira os campos destacados antes de continuar.
          </div>

          <button type="submit" class="btn-entrar">Criar conta</button>
        </form>

        <div
          id="g_id_onload"
          data-client_id="878733578437-8kgjjrua5amcaurlk83j44l6g9av827p.apps.googleusercontent.com"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false"
        ></div>

        <div
          class="g_id_signin gap"
          data-type="standard"
          data-size="large"
          data-theme="filled_black"
          data-shape="pill"
        ></div>

        <div class="divider">ou</div>

        <div class="signup-row">
          Já tem conta?
          <button type="button" id="btn-fazer-login">Entrar</button>
        </div>
      </div>
      <p class="app-copyright">© 2026 Bolso</p>
    </div>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script src="loading.js"></script>
    <script src="script.js"></script>
  </body>
</html>
