<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolso — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div class="login-wrapper">
      <div class="brand">
        <div class="brand-mark">R$</div>
        <div class="brand-title">Bolso</div>
      </div>

      <div class="login-card">
        <div class="login-heading">
          <h1>Entrar na sua conta</h1>
          <p>Controle suas finanças e sua organização em um só lugar.</p>
        </div>

        <form class="login-form" id="login-form">
          <div class="field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="voce@email.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <div class="field-password-wrap">
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Sua senha"
                required
                autocomplete="current-password"
              />
              <button type="button" class="toggle-visibility" id="toggle-senha">
                mostrar
              </button>
            </div>
          </div>

          <!--<div class="row-between">
            <button type="button" class="link-forgot" id="btn-esqueci">
              Esqueci a senha
            </button>
          </div>-->

          <div class="error-msg" id="error-msg">
            Verifique seu e-mail e senha e tente novamente.
          </div>

          <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <div class="divider">ou</div>

        <div class="signup-row">
          Ainda não tem conta?
          <button type="button" id="btn-criar-conta">Criar conta</button>
        </div>

        <div
          id="g_id_onload"
          data-client_id="878733578437-8kgjjrua5amcaurlk83j44l6g9av827p.apps.googleusercontent.com"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false"
        ></div>
        <div
          class="g_id_signin gap"
          data-type="standard"
          data-size="large"
          data-theme="filled_black"
          data-shape="pill"
        ></div>

        <div>
          <button id="esqueci-senha-btn" class="btn-forgot-password">
            Esqueci minha senha
          </button>
        </div>
      </div>
      <p class="app-copyright">© 2026 Bolso</p>
    </div>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script src="loading.js"></script>
    <script src="script.js"></script>
  </body>
</html>
