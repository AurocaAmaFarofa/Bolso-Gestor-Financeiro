<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolso — Alterar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <div class="brand">
        <div class="brand-mark">R$</div>
        <div class="brand-title">Bolso</div>
      </div>

      <section class="login-card" aria-labelledby="alterar-senha-titulo">
        <div class="login-heading">
          <h1 id="alterar-senha-titulo">Crie uma nova senha</h1>
          <p>
            Escolha uma senha com pelo menos 12 caracteres e confirme para
            continuar.
          </p>
        </div>

        <form class="login-form" id="alterar-senha-form" novalidate>
          <div class="field">
            <label for="senha">Nova senha</label>
            <div class="field-password-wrap">
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua nova senha"
                required
                autocomplete="new-password"
                minlength="12"
                maxlength="64"
                aria-describedby="senha-requisitos strength-label"
              />
              <button
                type="button"
                class="toggle-visibility"
                id="toggle-senha"
                aria-label="Mostrar nova senha"
                aria-pressed="false"
              >
                mostrar
              </button>
            </div>
            <div class="strength-meter" aria-hidden="true">
              <div class="strength-bar" id="bar-1"></div>
              <div class="strength-bar" id="bar-2"></div>
              <div class="strength-bar" id="bar-3"></div>
            </div>
            <div class="strength-label" id="strength-label">
              Mínimo de 12 caracteres
            </div>
            <p class="hint" id="senha-requisitos">
              Use entre 12 e 64 caracteres.
            </p>
          </div>

          <div class="field">
            <label for="confirmar-senha">Confirmar nova senha</label>
            <div class="field-password-wrap">
              <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Digite novamente a nova senha"
                required
                autocomplete="new-password"
                aria-describedby="confirmacao-label"
              />
              <button
                type="button"
                class="toggle-visibility"
                id="toggle-confirmar"
                aria-label="Mostrar confirmação da senha"
                aria-pressed="false"
              >
                mostrar
              </button>
            </div>
            <div class="strength-label" id="confirmacao-label"></div>
          </div>

          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn-entrar" id="btn-alterar-senha">
            Alterar senha
          </button>
        </form>

        <div class="signup-row">
          <a href="login.html">Voltar para o login</a>
        </div>
      </section>
      <p class="app-copyright">© 2026 Bolso</p>
    </main>
    <script src="loading.js"></script>
    <script src="recuperar-senha.js"></script>
  </body>
</html>
