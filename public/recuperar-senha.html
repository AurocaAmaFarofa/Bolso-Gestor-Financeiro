<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolso — Recuperar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <div class="brand">
        <div class="brand-mark">R$</div>
        <div class="brand-title">Bolso</div>
      </div>

      <section class="login-card" aria-labelledby="recuperar-senha-titulo">
        <div class="login-heading">
          <h1 id="recuperar-senha-titulo">Recuperar senha</h1>
          <p>
            Informe o e-mail da sua conta e enviaremos as instruções para
            redefinir sua senha.
          </p>
        </div>

        <form class="login-form" id="recuperar-senha-form">
          <div class="field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="voce@email.com"
              required
              autocomplete="email"
            />
          </div>

          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>

          <div class="development-link" id="development-link" hidden>
            <span
              >Link de recuperação para desenvolvimento (Link temporário!,
              desaparecerá assim que você sair da pagina):</span
            >
            <a id="link-recuperacao"></a>
          </div>

          <button type="submit" class="btn-entrar" id="btn-enviar-email">
            Enviar e-mail
          </button>
        </form>

        <div class="signup-row">
          <a href="login.html">Voltar para o login</a>
        </div>
      </section>
      <p class="app-copyright">© 2026 Bolso</p>
    </main>
    <script src="loading.js"></script>
    <script src="recuperar-senha.js"></script>
  </body>
</html>
